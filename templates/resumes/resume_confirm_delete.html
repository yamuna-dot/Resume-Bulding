{% extends 'base.html' %}

{% block title %}Delete Resume - {{ resume.title }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="custom-card p-4 p-md-5 text-center bg-white shadow-sm border-danger border-opacity-25">
        <div class="stat-icon mx-auto mb-3" style="background-color: #fee2e2; color: #dc2626; width: 64px; height: 64px; font-size: 1.75rem;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h4 class="fw-bold mb-2 text-danger">Delete Resume?</h4>
        <p class="text-muted mb-4">
          Are you sure you want to delete <strong>"{{ resume.title }}"</strong> ({{ resume.full_name }})?
          This action is permanent and cannot be undone.
        </p>

        <form method="POST">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">
              <i class="fa-solid fa-times me-1"></i> Cancel
            </a>
            <button type="submit" class="btn btn-danger px-4">
              <i class="fa-solid fa-trash me-1"></i> Yes, Delete Resume
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
